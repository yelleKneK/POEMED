url: https://yelleknek.github.io/POEMED/

template:
  bootstrap: 5
  # The help pages carry \eqn{} and \deqn{} formulas, which pkgdown writes as
  # TeX; KaTeX renders them on the reference pages. The default (MathML)
  # applies only to articles, and the vignettes carry no math.
  math-rendering: katex
  bslib:
    primary: "#1c5a83"     # azurite, the hex ground
    secondary: "#c69c3f"   # brass, the hex trim
    border-radius: 0.5rem

home:
  title: "POEMED: Power Enhancement for High-Dimensional Mediation Analysis"
  description: >
    Powerful global tests for high-dimensional mediation analysis with
    heterogeneous and even contrasting mediation effects, for continuous,
    binary, and count outcomes, with identification of the active mediators
    under familywise error rate or false discovery rate control. Implements
    Yu and Kelley (in press, Journal of the American Statistical Association).

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

# The package's own vignette is the "Get started" link, so the Articles
# menu lists the section below it; "navbar: ~" puts that section's
# articles in the menu without a heading.
articles:
- title: Start Here
  contents:
  - POEMED
- title: The Article and the Benchmark
  navbar: ~
  contents:
  - reproducing-the-article
  - poemed-vs-competitors

# Organized by workflow. pkgdown::check_pkgdown() verifies that every
# documented topic is listed; place each new export in its family below.
reference:
- title: Testing for Mediation
  desc: The power-enhanced global test and its outcome-specific workers.
  contents:
  - pe_mediation
  - pe_mediate
  - pe_mediation_linear
  - pe_mediation_logistic
  - pe_mediation_poisson
- title: Identifying the Active Mediators
  contents:
  - pe_mediators
  - pe_selection
- title: Planning and Monte Carlo Studies
  desc: Size, power, identification, and sample size planning by simulation.
  contents:
  - pe_power_curve
  - pe_simulation_study
  - pe_identification_study
  - ss_power_pe_mediation
- title: Simulating Mediation Data
  contents:
  - simulate_mediation_data
  - simulate_guo_mediation
  - mediation_ar1_cov
- title: The WHO Health-Expenditure Analysis
  contents:
  - WHO_mediation_analysis
  - WHO_mediation_design
- title: Results, Printing, and Tidiers
  contents:
  - poemed_tbl
  - summary.poemed_tbl
  - plot.poemed_tbl
  - poemed_broom
- title: Data Sets
  contents:
  - WHO_health_mediation
  - WHO_indicator_codebook
  - guo_calibration
  - example_data
- title: Package Overview
  contents:
  - POEMED-package
